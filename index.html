<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bus Driving Game</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="game-container">
    <div class="hud">
      <div class="score-board">Score: <span id="score">0</span></div>
      <div class="passengers-board">Passengers Picked: <span id="passengers">0</span></div>
    </div>
    
    <canvas id="gameCanvas" width="400" height="600"></canvas>
    
    <div id="startOverlay" class="overlay">
      <h1>🚌 Bus Simulator Express</h1>
      <p>Use <strong>Left / Right Arrow</strong> or <strong>A / D</strong> keys to steer.</p>
      <p>Avoid cars 🚗 and stop at yellow zones 🚏 to pick up passengers!</p>
      <button id="startBtn">Start Game</button>
    </div>

    <div id="gameOverOverlay" class="overlay hidden">
      <h1>💥 Crash! Game Over</h1>
      <p>Final Score: <span id="finalScore">0</span></p>
      <p>Total Passengers Picked: <span id="finalPassengers">0</span></p>
      <button id="restartBtn">Play Again</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
